---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: "0.1"
  name: run-script-remote-oci-ta
spec:
  description: |-
    This task allows to run a script stored on the git repository and stores the resultant directory
    to use it later.
  params:
  - name: SCRIPT_RUNNER_IMAGE
    description: The image to run the script in
    type: string
  - name: SCRIPT
    description: The script to launch
    type: string
  - name: SCRIPT_DEPENDENCIES
    description: The script to launch to install dependencies. It will be executed before the SCRIPT
    type: string
  - name: SCRIPT_WORKDIR
    description: The directory to launch the script from
    type: string
  - description: The platform to build on
    name: PLATFORM
    type: string
  - name: ociStorage
    description: The OCI repository where the Trusted Artifacts are stored (e.g., quay.io/myorg/artifacts)
    type: string
    default: ""
  - name: ociArtifactExpiresAfter
    description: Expiration date for the trusted artifacts created in the OCI repository (e.g., 30d, 90d). Empty string means no expiration.
    type: string
    default: ""
  - name: SCRIPT_ARTIFACT_RELATIVE_PATH
    description: Relative path within /shared/ to package as OCI artifact
    type: string
    default: "."
  - name: REGISTRY_SECRET
    description: Name of the secret containing registry credentials (dockerconfigjson type)
    type: string
    default: ""
  results:
    - name: SCRIPT_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
    - name: SCRIPT_OUTPUT
      description: A string generated by the script run. This can be used as input to future tasks' parameters.
      type: string
    - name: SCRIPT_OUTPUT_ARRAY
      description: An array of data generated by the script run. This can be used as input to future tasks' parameters.
      type: array
  stepTemplate:
    computeResources:
      limits:
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 1Gi
    env:
    - name: SCRIPT
      value: $(params.SCRIPT)
    - name: PLATFORM
      value: $(params.PLATFORM)
    volumeMounts:
    - mountPath: /shared
      name: shared
    - mountPath: /var/workdir
      name: workdir
    - mountPath: /ssh/
      name: ssh
  steps:
    - name: run-script-remote-win
      image: quay.io/konflux-ci/buildah-task:latest@sha256:c8d667a4efa2f05e73e2ac36b55928633d78857589165bd919d2628812d7ffcb
      workingDir: /var/workdir
      env:
        - name: PLATFORM
          value: $(params.PLATFORM)
        - name: SCRIPT
          value: $(params.SCRIPT)
        - name: SCRIPT_DEPENDENCIES
          value: $(params.SCRIPT_DEPENDENCIES)
        - name: SCRIPT_WORKDIR
          value: $(params.SCRIPT_WORKDIR)
        - name: SCRIPT_RUNNER_IMAGE
          value: $(params.SCRIPT_RUNNER_IMAGE)
      script: |
        #!/bin/bash
        set -e
        set -o verbose

        # echo "${PLATFORM}" | cut -d'/' -f1

        echo "[$(date --utc -Ins)] Prepare connection"

        mkdir -p ~/.ssh
        if [ -e "/ssh/error" ]; then
          #no server could be provisioned
          cat /ssh/error
          exit 1
        fi
        export SSH_HOST=$(cat /ssh/host)

        if [ -e "/ssh/otp" ]; then
          # TODO: REMOVE THE -k FROM HERE!
          curl -k --cacert /ssh/otp-ca -XPOST -d @/ssh/otp $(cat /ssh/otp-server) >~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
        else
          cp /ssh/id_rsa ~/.ssh
        fi

        mkdir -p scripts

        echo "[$(date --utc -Ins)] Setup VM"
        chmod 0400 ~/.ssh/id_rsa
        export BUILD_DIR=$(cat /ssh/user-dir)
        export SSH_ARGS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10"
        echo "$BUILD_DIR"
        # shellcheck disable=SC2086

        # Windows Path Separator
        S='\\'
        VOLUMES_DIR="${BUILD_DIR}${S}volumes"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command New-Item -ItemType Directory -Force -Path ${VOLUMES_DIR@Q}"
        SCRIPTS_DIR="${BUILD_DIR}${S}scripts"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command New-Item -ItemType Directory -Force -Path ${SCRIPTS_DIR@Q}"
        WORKSPACES_DIR="${BUILD_DIR}${S}workspaces"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command New-Item -ItemType Directory -Force -Path ${WORKSPACES_DIR@Q}"

        echo "[$(date --utc -Ins)] Scp data"

        LBUILD_DIR=$(echo "$BUILD_DIR" | sed 's|\\\\|/|g' | sed 's|\\|/|g' )

        printf '%s' "${SCRIPT}" > /tmp/script.ps1
        scp "/tmp/script.ps1" "${SSH_HOST}:${LBUILD_DIR}/scripts/script.ps1"
                printf '%s' "${SCRIPT_DEPENDENCIES}" > /tmp/script_dependencies.ps1
        scp "/tmp/script_dependencies.ps1" "${SSH_HOST}:${LBUILD_DIR}/scripts/script_dependencies.ps1"

        scp -r '/shared/' "${SSH_HOST}:${LBUILD_DIR}/volumes/shared/"
        scp -r '/var/workdir/' "${SSH_HOST}:${LBUILD_DIR}/volumes/workdir/"
        scp -r "/tekton/results/" "${SSH_HOST}:${LBUILD_DIR}/results/"

        echo "[$(date --utc -Ins)] Run docker container"

        WORKDIR_VOLUME_MOUNT="type=bind,source=${LBUILD_DIR}/volumes/workdir/,target=C:/workdir/"
        SHARED_VOLUME_MOUNT="type=bind,source=${LBUILD_DIR}/volumes/shared/,target=C:/shared"
        RESULTS_VOLUME_MOUNT="type=bind,source=${LBUILD_DIR}/results/,target=C:/tekton/results/"
        SCRIPTS_VOLUME_MOUNT="type=bind,source=${LBUILD_DIR}/scripts/,target=${SCRIPT_WORKDIR}"
        SCRIPT_DEPENDENCIES_FULLPATH="${SCRIPT_WORKDIR}script_dependencies.ps1"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command docker run --name install-dependencies --mount ${SCRIPTS_VOLUME_MOUNT} --mount ${RESULTS_VOLUME_MOUNT} --workdir ${SCRIPT_WORKDIR@Q} ${SCRIPT_RUNNER_IMAGE@Q} powershell -File ${SCRIPT_DEPENDENCIES_FULLPATH@Q}"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command docker commit install-dependencies install-dependencies"
        SCRIPT_FULLPATH="${SCRIPT_WORKDIR}script.ps1"
        ssh $SSH_ARGS "$SSH_HOST" "powershell -Command docker run --rm --mount ${SCRIPTS_VOLUME_MOUNT} --mount ${RESULTS_VOLUME_MOUNT} --workdir ${SCRIPT_WORKDIR@Q} install-dependencies powershell -File ${SCRIPT_FULLPATH@Q}"

        echo "[$(date --utc -Ins)] Scp back"
        scp -r "${SSH_HOST}:${LBUILD_DIR}/volumes/shared/" '/shared/'
        scp -r "${SSH_HOST}:${LBUILD_DIR}/volumes/workdir/" '/var/workdir/'
        scp -r "${SSH_HOST}:${LBUILD_DIR}/results/" '/tekton/results/'
      securityContext:
        capabilities:
          add:
            - SETFCAP

    - name: create-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
      args:
        - create
        - --store
        - $(params.ociStorage)
        - $(results.SCRIPT_ARTIFACT.path)=/shared/$(params.SCRIPT_ARTIFACT_RELATIVE_PATH)
      volumeMounts:
        - mountPath: /shared
          name: shared
        - mountPath: /root/.docker
          name: registry-auth
          readOnly: true
      env:
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.ociArtifactExpiresAfter)
        - name: REGISTRY_AUTH_FILE
          value: /root/.docker/config.json
      when:
        - input: "$(params.ociStorage)"
          operator: notin
          values: [""]
      computeResources:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 512Mi

  volumes:
  - name: workdir
    emptyDir: {}
  - name: varlibcontainers
    emptyDir: {}
  - name: additional-secret
    secret:
      optional: true
      secretName: $(params.ADDITIONAL_SECRET)
  - emptyDir: {}
    name: shared
  - name: registry-auth
    secret:
      optional: true
      secretName: $(params.REGISTRY_SECRET)
      items:
        - key: .dockerconfigjson
          path: config.json
  - name: ssh
    secret:
      optional: false
      secretName: multi-platform-ssh-$(context.taskRun.name)
