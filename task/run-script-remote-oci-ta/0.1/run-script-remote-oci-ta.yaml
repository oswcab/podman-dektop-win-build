---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: "0.1"
  name: run-script-remote-oci-ta
spec:
  description: |-
    This task allows to run a script stored on the git repository and stores the resultant directory
    to use it later.
  params:
  - name: SCRIPT_RUNNER_IMAGE
    description: The image to run the script in
    type: string
  - name: SCRIPT
    description: The script to launch
    type: string
  - name: SCRIPT_WORKDIR
    description: The directory to launch the script from
    type: string
  - description: The platform to build on
    name: PLATFORM
    type: string
  results:
    - name: SCRIPT_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the application source code.
    - name: SCRIPT_OUTPUT
      description: A string generated by the script run. This can be used as input to future tasks' parameters.
      type: string
    - name: SCRIPT_OUTPUT_ARRAY
      description: An array of data generated by the script run. This can be used as input to future tasks' parameters.
      type: array
  stepTemplate:
    computeResources:
      limits:
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 1Gi
    env:
    - name: SCRIPT
      value: $(params.SCRIPT)
    - name: PLATFORM
      value: $(params.PLATFORM)
    volumeMounts:
    - mountPath: /shared
      name: shared
    - mountPath: /var/workdir
      name: workdir
  steps:
    - name: run-script-remote-win
      image: quay.io/konflux-ci/buildah-task:latest@sha256:c8d667a4efa2f05e73e2ac36b55928633d78857589165bd919d2628812d7ffcb
      workingDir: /var/workdir
      env:
        - name: PLATFORM
          value: $(params.PLATFORM)
        - name: SCRIPT
          value: $(params.SCRIPT)
        - name: SCRIPT_WORKDIR
          value: $(params.SCRIPT_WORKDIR)
        - name: SCRIPT_RUNNER_IMAGE
          value: $(params.SCRIPT_RUNNER_IMAGE)
      script: |
        #!/bin/bash
        set -e
        set -o verbose

        # echo "${PLATFORM}" | cut -d'/' -f1

        # Windows Path Separator
        S='\\'

        echo "[$(date --utc -Ins)] Prepare connection"

        mkdir -p ~/.ssh
        if [ -e "/ssh/error" ]; then
          #no server could be provisioned
          cat /ssh/error
          exit 1
        fi
        export SSH_HOST=$(cat /ssh/host)

        if [ -e "/ssh/otp" ]; then
          curl --cacert /ssh/otp-ca -XPOST -d @/ssh/otp $(cat /ssh/otp-server) >~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
        else
          cp /ssh/id_rsa ~/.ssh
        fi

        mkdir -p scripts

        echo "[$(date --utc -Ins)] Setup VM"
        chmod 0400 ~/.ssh/id_rsa
        export BUILD_DIR=$(cat /ssh/user-dir)
        export SSH_ARGS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10"
        echo "$BUILD_DIR"
        # shellcheck disable=SC2086
        ssh $SSH_ARGS "$SSH_HOST"  mkdir -p "${BUILD_DIR@Q}${S}workspaces" "${BUILD_DIR@Q}${S}scripts" "${BUILD_DIR@Q}${S}volumes"

        echo "[$(date --utc -Ins)] Scp data"

        printf '%s' "$SCRIPT" > /tmp/script.ps1
        # rsync -razW "/tmp/script.ps1" "$SSH_HOST:$BUILD_DIR${S}scripts${S}script.ps1"
        # rsync -razW '/shared/' "$SSH_HOST:$BUILD_DIR${S}volumes${S}shared${S}"
        # rsync -razW '/var/workdir/' "$SSH_HOST:$BUILD_DIR${S}volumes${S}workdir${S}"
        # rsync -razW "/tekton/results/" "$SSH_HOST:$BUILD_DIR${S}results${S}"
        scp "/tmp/script.ps1" "$SSH_HOST:$BUILD_DIR${S}scripts${S}script.ps1"
        scp '/shared/' "$SSH_HOST:$BUILD_DIR${S}volumes${S}shared${S}"
        scp '/var/workdir/' "$SSH_HOST:$BUILD_DIR${S}volumes${S}workdir${S}"
        scp "/tekton/results/" "$SSH_HOST:$BUILD_DIR${S}results${S}"

        ssh $SSH_ARGS "$SSH_HOST" $PORT_FORWARD docker run \
          -v "${BUILD_DIR@Q}${S}volumes${S}shared:C:${S}shared" \
          -v "${BUILD_DIR@Q}${S}volumes${S}workdir:C:${S}var${S}workdir" \
          -v "${BUILD_DIR@Q}${S}results${S}:C:${S}tekton${S}results" \
          -v "${BUILD_DIR@Q}${S}scripts:${SCRIPT_WORKDIR@Q}${S}scripts" \
          --rm \
          "${SCRIPT_RUNNER_IMAGE@Q}" \
          "${SCRIPT_WORKDIR@Q}${S}script.ps1"

        echo "[$(date --utc -Ins)] Rsync back"
        scp "$SSH_HOST:$BUILD_DIR${S}volumes${S}shared${S}" '/shared/'
        scp "$SSH_HOST:$BUILD_DIR${S}volumes${S}workdir${S}" '/var/workdir/'
        scp "$SSH_HOST:$BUILD_DIR${S}results${S}" '/tekton/results/'
      securityContext:
        capabilities:
          add:
            - SETFCAP
  volumes:
  - name: workdir
    emptyDir: {}
  - name: varlibcontainers
    emptyDir: {}
  - name: additional-secret
    secret:
      optional: true
      secretName: $(params.ADDITIONAL_SECRET)
  - emptyDir: {}
    name: shared
  - name: ssh
    secret:
      optional: false
      secretName: multi-platform-ssh-$(context.taskRun.name)
